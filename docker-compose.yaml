services:
  postgres:
    image: postgres:17
    container_name: notaryflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: notaryflow
      POSTGRES_USER: notaryflow
      POSTGRES_PASSWORD: notaryflow_dev_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: